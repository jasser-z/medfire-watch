<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MedFire Live camera</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #07101b;
        color: #edf5fa;
        font: 14px system-ui;
      }
      .shell {
        max-width: 1280px;
        margin: auto;
        padding: 12px;
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.18em;
        color: #ffbd89;
      }
      h1 {
        font-size: 20px;
        margin: 4px 0;
      }
      .stage {
        position: relative;
        aspect-ratio: 16/9;
        background: #02070c;
        border: 1px solid #7896aa55;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 18px 48px #0008;
      }
      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      canvas {
        pointer-events: none;
      }
      .status {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: #b9cddb;
        margin-top: 10px;
      }
      .chip {
        background: #102535;
        border: 1px solid #7896aa55;
        border-radius: 99px;
        padding: 7px 10px;
        font-size: 12px;
      }
      button {
        background: #ffad75;
        color: #1c2730;
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }
      #notice {
        color: #ffcf9e;
      }
      .cooldown-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: 12px 0;
        padding: 12px 14px;
        background: #10202e;
        border: 1px solid #7896aa44;
        border-radius: 12px;
      }
      .cooldown-controls input {
        width: 82px;
        padding: 9px;
        border: 1px solid #7896aa77;
        border-radius: 8px;
        background: #07101b;
        color: #edf5fa;
        font: inherit;
      }
      .cooldown-controls .secondary {
        background: transparent;
        color: #ffbd89;
        border: 1px solid #ffbd8966;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      #cooldown-feedback {
        color: #b9cddb;
        font-size: 12px;
        flex-basis: 100%;
      }
      .debug {
        margin-top: 9px;
        padding: 10px;
        background: #04111d;
        border: 1px solid #7896aa55;
        border-radius: 8px;
        font:
          12px ui-monospace,
          monospace;
        white-space: pre-wrap;
      }
      @media (max-width: 600px) {
        .shell {
          padding: 8px;
        }
        .head {
          align-items: flex-start;
          flex-direction: column;
        }
        .stage {
          border-radius: 9px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="head">
        <div>
          <div class="eyebrow">LIVE CAMERA · FULL QUALITY DISPLAY</div>
          <h1>Fire and smoke watch</h1>
        </div>
        <button id="start">Start camera</button>
      </div>
      <div class="stage"><video id="video" playsinline muted></video><canvas id="overlay"></canvas></div>
      <div class="status">
        <span class="chip" id="track">Camera not started</span><span class="chip" id="detect">Detection waiting</span
        ><span class="chip" id="alert">Alerts 0 delivered · 0 failed</span><span id="notice"></span>
      </div>
      <div class="cooldown-controls" aria-label="Camera alert cooldown">
        <label for="cooldown-minutes">Alert cooldown (minutes)</label>
        <input id="cooldown-minutes" type="number" min="0" max="1440" step="1" value="5" disabled />
        <button id="cooldown-save" disabled>Save interval</button>
        <button id="cooldown-reset" class="secondary" disabled>Reset current wait</button>
        <span id="cooldown-feedback" role="status" aria-live="polite">Loading cooldown settings…</span>
      </div>
      <pre class="debug" id="debug" hidden></pre>
    </main>
    <script type="module" src="/live-camera/app.mjs"></script>
    <style>
      .stage .status {
        position: absolute;
        bottom: 12px;
        left: 12px;
        right: 12px;
        z-index: 3;
        pointer-events: none;
      }
      .stage .chip {
        background: #071523e8;
      }
      .fullscreen-button {
        position: absolute;
        right: 12px;
        top: 12px;
        z-index: 4;
        touch-action: manipulation;
      }
      .stage:fullscreen {
        width: 100vw;
        height: 100dvh;
        aspect-ratio: auto;
        border: 0;
        border-radius: 0;
        background: #000;
      }
    </style>
  </body>
</html>

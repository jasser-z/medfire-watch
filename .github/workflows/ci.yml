name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -c constraints-py311.txt
          pip install -r requirements-dev.txt -c constraints-py311.txt
      - name: Ruff
        run: ruff check .
      - name: Python compilation and installed dependency consistency
        run: |
          python -m compileall -q api alerts medfire_watch dashboard scripts
          python -m pip check
      - name: Pytest
        run: pytest -q --maxfail=1 --cov=api --cov=alerts --cov=medfire_watch --cov-report=term-missing --cov-report=xml
      - name: Install browser test dependencies
        run: npm ci
      - name: JavaScript tests and coverage
        run: |
          mkdir -p runs/coverage
          npm run test:coverage | tee runs/coverage/javascript.txt
      - name: Browser asset formatting
        run: npm run format:check
      - name: Browser module syntax
        run: node scripts/check_ui_syntax.mjs
      - name: Dependency advisories
        run: |
          npm audit --audit-level=moderate
          python scripts/audit_dependencies.py
      - name: Documentation links and images
        run: python scripts/check_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            runs/coverage/javascript.txt
      - name: Smoke test real API health
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.main import app
          response = TestClient(app).get('/health')
          assert response.status_code == 200
          assert response.json()['status'] == 'ok'
          PY
